<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Dark Gradient Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Outer Glow/Ring -->
  <rect width="480" height="480" x="16" y="16" rx="112" stroke="url(#ringGradient)" stroke-width="8" opacity="0.3"/>
  <rect width="512" height="512" rx="128" fill="url(#glassOverlay)" opacity="0.1"/>

  <!-- Shield Shape -->
  <path d="M256 100 L400 160 L400 280 C400 390 256 440 256 440 C256 440 112 390 112 280 L112 160 Z" fill="url(#shieldGradient)" opacity="0.2"/>
  <path d="M256 100 L400 160 L400 280 C400 390 256 440 256 440 C256 440 112 390 112 280 L112 160 Z" stroke="url(#shieldBorder)" stroke-width="12" stroke-linejoin="round"/>

  <!-- The "Z" Symbol for zytrone -->
  <path d="M190 200 L320 200 L190 320 L320 320" stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 200 L320 200 L190 320 L320 320" stroke="url(#glowGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" style="filter: blur(8px)" opacity="0.6"/>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glassOverlay" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="112" y1="100" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="112" y1="100" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="190" y1="200" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
</svg>
